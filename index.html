<div id="duplicateToast" class="duplicate-toast" role="status" aria-live="polite" hidden></div>
<main>
<header><div class="brand"><img src="./icons/joonmp3-icon.png" alt="JOONmp3"></div><div class="header-actions"><button id="headerAdd" class="circle" aria-label="새 항목 추가"></button><button id="headerSettings" class="circle" aria-label="설정"></button></div></header>
<button id="collectionBack" hidden style="color:var(--accent);padding:0;text-align:left">‹ 플레이리스트와 폴더</button><h1 id="pageTitle">보관함</h1>

<section id="recordingsPanel" hidden></section>
<p id="status" class="status" role="status" hidden>저장된 음악을 불러오는 중…</p>
<div id="collections" hidden></div><div id="searchBox" class="searchbox" hidden><span id="searchIcon"></span><input id="search" type="search" placeholder="음악 이름 검색" aria-label="음악 검색"></div>
<nav id="folders" class="folders" aria-label="음악 폴더"></nav>
<div id="listHeader" class="library-head"><h2 id="folderTitle">전체 음악</h2><span id="count" class="count" hidden>0곡</span><button id="selectMode" class="select-link">선택</button></div>
<div id="selectionTools" class="selection-tools" hidden><button id="selectAll">전체 선택</button><span id="selectedCount">0곡 선택</span><button id="clearSelected">선택 해제</button></div>
<div id="listToolbar" class="toolbar"><button id="playList">재생</button><button id="shuffleList">임의 재생</button><button id="collectionEdit" hidden>편집</button><select id="sort" aria-label="곡 정렬"><option value="added">추가 순</option><option value="title">제목 순</option></select></div>
<div id="trackList"></div>
<section id="settingsPanel" hidden><div class="setting-tools"><button id="openConvert" disabled>영상 → MP3</button><button id="backup" disabled>음악함 백업</button><label for="restorePicker">백업 복원</label><input id="restorePicker" type="file" accept=".joon" disabled></div><button id="demo" class="demo" disabled>테스트 음악 추가</button><div id="history" hidden></div></section>

<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const audio = $('audio');
  const STATE_KEY = 'joonmp3-v2-state';
  let db, tracks = [], folders = [], queue = [], activeFolder = 'all', currentId = null;
  let repeatAll = true, importing = false, selectedId = null, playGeneration = 0, lastSaved = 0;
  let restoreAt = 0, history = [], prepared = new Map(), preparing = new Map();
  let selecting = false, selectedTracks = new Set(), pendingBulkIds = [], pendingPlaylistId = null, bulkBusy = false;
  let collectionMenuId = null, recorderUI = null;
  let resumeBlocked = false, interruptionGeneration = 0;
  let view = 'library', searchText = '', sortBy = 'added', favoritesOnly = false;
  let ready = false, maintenance = false, converting = false, videoFile = null, convertWorker = null, conversionToken = 0;
  const fmt = n => { n = Number.isFinite(n) ? Math.max(0, Math.floor(n)) : 0; return Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0'); };
  const sizeLabel = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.ceil(n / 1024) + ' KB';
  const track = id => tracks.find(t => t.id === id);
  const folderName = id => folders.find(f => f.id === id)?.name || '음악함';
  const physicalFolders = () => folders.filter(f => f.kind !== 'playlist' && f.kind !== 'recording');
  const collection = () => folders.find(f => f.id === activeFolder);
  const searchKey = value => String(value || '').normalize('NFKC').toLocaleLowerCase().replace(/[\s\p{P}\p{Cf}]/gu,'');
  function searchTitle(node, title) {
    const text=String(title || '').normalize('NFC'); const query=searchKey(searchText);
    if(view!=='search' || !query){node.textContent=text;return;}
    const chars=Array.from(text), map=[], parts=[];let key='';
    chars.forEach((ch,index)=>{const k=searchKey(ch);key+=k;for(let j=0;j<k.length;j++)map.push(index);});
    let pos=0;
    while((pos=key.indexOf(query,pos))!==-1){parts.push([map[pos],map[pos+query.length-1]+1]);pos+=query.length;}
    const hits=new Set();for(const [a,b] of parts)for(let i=a;i<b;i++)hits.add(i);
    let start=0;while(start<chars.length){let end=start+1;const hit=hits.has(start);while(end<chars.length&&hits.has(end)===hit)end++;const span=document.createElement(hit?'strong':'span');span.className=hit?'search-match':'search-rest';span.textContent=chars.slice(start,end).join('');node.append(span);start=end;}
  }
  const visibleTracks = () => {
    const f = collection();
    let list = view === 'search' ? tracks.slice() : f?.kind === 'playlist' ? (f.trackIds || []).map(track).filter(Boolean) : tracks.filter(t => activeFolder === 'all' || t.folderId === activeFolder);
    list = list.filter(t => !t.recordingDeletedAt && (!t.isRecording || t.inMusic));
    if (favoritesOnly && view !== 'search') list = list.filter(t => t.favorite);
    if (view === 'search') list = list.filter(t => searchKey(t.name).includes(searchKey(searchText)) || searchKey(t.filename).includes(searchKey(searchText)));
    return list.slice().sort((a,b) => Number(!!b.pinned) - Number(!!a.pinned) || (sortBy === 'title' ? a.name.localeCompare(b.name,'ko') : f?.kind === 'playlist' ? 0 : a.addedAt - b.addedAt));
  };
  function say(message) { $('status').textContent = message; if (/실패|못했|부족|손상|같은 이름|저장 공간을 열지|다른 JOONmp3/.test(message)) showDuplicate(message); }
  let duplicateTimer = null;
  function showDuplicate(message = '이미 같은 곡이 플레이어에 저장되어 있습니다', names = []) {
    const toast = $('duplicateToast');
    const sheet = ['bulkMoveMenu','bulkDeleteMenu','convertMenu','songMenu','songPicker','playlistPicker','collectionMenu','addMenu','nowPlaying'].map($).find(v=>v.open);
    (sheet || document.body).prepend(toast);
    const title = names.length ? names[0] + (names.length > 1 ? ' 외 ' + (names.length - 1) + '곡' : '') : '';
    toast.textContent = (title ? title + '\n' : '') + message;
    toast.hidden = false;
    clearTimeout(duplicateTimer);
    duplicateTimer = setTimeout(() => { toast.hidden = true; },3000);
  }
  async function fileHash(blob) {
    const hash = await crypto.subtle.digest('SHA-256',await blob.arrayBuffer());
    return Array.from(new Uint8Array(hash),v=>v.toString(16).padStart(2,'0')).join('');
  }
  async function identicalTrack(blob, hash, folderId = null) {
    for (const t of tracks.filter(v=>v.size===blob.size && (!folderId || v.folderId===folderId))) {
      let savedHash = t.contentHash;
      if (!savedHash) {
        const saved = await readAudioFile(t.id);
        if (!saved) continue;
        savedHash = await fileHash(saved);
        t.contentHash = savedHash;
        write(['tracks'],tx=>tx.objectStore('tracks').put({...t})).catch(()=>{});
      }
      if (savedHash === hash) return t;
    }
    return null;
  }

  function saveState() {
    try { localStorage.setItem(STATE_KEY, JSON.stringify({ currentId, position: audio.currentTime || 0, repeatAll, activeFolder, queue, history, view, sortBy })); } catch {}
  }
  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open('joonmp3-music-library', 1);
      request.onupgradeneeded = () => {
        const database = request.result;
        database.createObjectStore('tracks', { keyPath: 'id' });
        database.createObjectStore('files');
        database.createObjectStore('folders', { keyPath: 'id' });
      };
      request.onsuccess = () => { request.result.onversionchange = () => request.result.close(); resolve(request.result); };
      request.onerror = () => reject(request.error);
      request.onblocked = () => say('다른 JOONmp3 창을 닫고 다시 열어 주세요.');
    });
  }
  function read(store, key) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, 'readonly');
      const request = key === undefined ? tx.objectStore(store).getAll() : tx.objectStore(store).get(key);
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }
  function write(stores, operation) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(stores, 'readwrite');
      tx.oncomplete = () => resolve();
      tx.onabort = tx.onerror = () => reject(tx.error || new Error('저장 실패'));
      try { operation(tx); } catch (error) { tx.abort(); reject(error); }
    });
  }
  function playbackBlob(blob,t) {
    const ext=(t?.filename || '').split('.').pop().toLowerCase();
    const mime={mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',wav:'audio/wav',ogg:'audio/ogg',flac:'audio/flac'}[ext];
    return mime && blob.type!==mime ? blob.slice(0,blob.size,mime) : blob;
  }
  async function readAudioFile(id) {
    const t=track(id),stored=await read('files',id);if(!t || !stored?.size)throw Error('음악 파일 없음');
    let blob=stored;
    if(await stored.slice(0,10).text()==='JOONMP3B1\n') {
      const backup=await parseBackup(stored);
      const same=(a,b)=>typeof a==='string' && typeof b==='string' && a.normalize('NFC')===b.normalize('NFC');
      const matches=backup.items.filter(v=>v.t.id===id || t.fingerprint && v.t.fingerprint===t.fingerprint || same(v.t.filename,t.filename) || same(v.t.name,t.name));
      if(matches.length!==1)throw Error('백업에서 해당 곡을 구분하지 못했어요.');
      blob=matches[0].blob;
      const fixed={...t,size:blob.size,contentHash:await fileHash(blob)};
      await write(['tracks','files'],tx=>{tx.objectStore('tracks').put(fixed);tx.objectStore('files').put(blob,id);});Object.assign(t,fixed);
    }
    // An independent Blob avoids using a file-backed slice as the audio source.
    return new Blob([await blob.arrayBuffer()],{type:playbackBlob(blob,t).type});
  }
  async function prepare(id) {
    if (!id || !track(id)) return null;
    if (prepared.has(id)) return prepared.get(id);
    if (preparing.has(id)) return preparing.get(id);
    const pending = readAudioFile(id).then(blob => {
      if (!blob || !track(id)) throw new Error('음악 파일이 없습니다.');
      const url = URL.createObjectURL(playbackBlob(blob,track(id))); prepared.set(id, url); return url;
    }).finally(() => preparing.delete(id));
    preparing.set(id, pending); return pending;
  }
  function nextId() {
    const index = queue.indexOf(currentId);
    if (index < 0) return queue[0] || null;
    return queue[index + 1] || (repeatAll ? queue[0] : null);
  }
  function warmNext() {
    const id = nextId();
    if (id) prepare(id).catch(() => say('다음 곡을 준비하지 못했어요. 파일을 다시 추가해 주세요.'));
    const keep = new Set([currentId, id]);
    for (const [key, url] of prepared) if (!keep.has(key)) { URL.revokeObjectURL(url); prepared.delete(key); }
  }
  function updateMedia() {
    if (!('mediaSession' in navigator)) return;
    if(recorderUI?.playbackActive()) {recorderUI.updateMedia();return;}
    try {
      const t = track(currentId);
      navigator.mediaSession.metadata = t ? new MediaMetadata({ title: t.name, artist: 'JOONmp3', album: folderName(t.folderId), artwork: [{ src: new URL('./icons/joonmp3-icon.png', location.href).href, sizes: '512x512', type: 'image/png' }] }) : null;
      navigator.mediaSession.playbackState = audio.paused ? 'paused' : 'playing';
      if (navigator.mediaSession.setPositionState && Number.isFinite(audio.duration) && audio.duration > 0) navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate, position: Math.min(audio.currentTime, audio.duration) });
    } catch {}
  }
  function renderHistory() {
    $('history').replaceChildren();
    if (!history.length) { $('history').textContent = '아직 기록이 없습니다.'; return; }
    for (const entry of history.slice().reverse()) {
      const line = document.createElement('div');
      line.textContent = new Date(entry.at).toLocaleTimeString('ko-KR', { hour12: false }) + ' · ' + entry.name + ' · ' + entry.reason;
      $('history').append(line);
    }
  }
  function record(reason) {
    history.push({ at: Date.now(), name: track(currentId)?.name || '', reason });
    history = history.slice(-20); renderHistory(); saveState();
  }
  function render() {
    $('folders').replaceChildren();
    for (const f of [{ id: 'all', name: '전체' }, {id:'recorder',name:'녹음기'}, ...physicalFolders()]) {
      const button = document.createElement('button'); button.textContent = f.name;
      if(f.id==='recorder'){button.id='addRecording';button.className='recorder-tab';button.disabled=!ready||maintenance;}
      button.setAttribute('aria-pressed', String(f.id === activeFolder));
      button.onclick = () => {if(f.id==='recorder'){if(ready&&!maintenance)setView('recordings');return;} activeFolder = f.id; favoritesOnly = false; render(); saveState(); };
      $('folders').append(button);
    }
    const favorite = document.createElement('button'); favorite.textContent = '★ 즐겨찾기'; favorite.setAttribute('aria-pressed',String(favoritesOnly)); favorite.onclick=()=>{activeFolder='all';favoritesOnly=true;render();}; $('folders').append(favorite);
    const add = document.createElement('button'); add.textContent = '＋ 폴더'; add.className = 'new'; add.disabled = !ready; add.onclick = createFolder; $('folders').append(add);
    const list = visibleTracks();
    selectedTracks = new Set([...selectedTracks].filter(id=>list.some(t=>t.id===id)));
    renderNavigation(list);
    renderSelection(list);
    $('folderTitle').textContent = favoritesOnly ? '즐겨찾기' : activeFolder === 'all' ? view === 'search' ? '검색 결과' : '전체 음악' : folderName(activeFolder);
    $('count').textContent = '';
    $('trackList').replaceChildren();
    if (!list.length) { const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = ''; $('trackList').append(empty); }
    list.forEach((t, index) => {
      const row = document.createElement('div'); row.className = 'row' + (t.id === currentId ? ' current' : '');
      const button = document.createElement('button'); button.className = 'song'; button.dataset.id = t.id;
      const number = document.createElement('span'); number.className = 'number'; number.innerHTML = icon(t.id === currentId && !audio.paused ? 'playing' : 'music');
      const info = document.createElement('span'); info.className = 'song-info';
      const name = document.createElement('span'); name.className = 'song-name'; searchTitle(name,(t.pinned ? '⌖ ' : '') + t.name + (t.favorite ? ' ★' : ''));
      const detail = document.createElement('span'); detail.className = 'song-detail'; detail.textContent = Number.isFinite(t.duration) ? fmt(t.duration) : ''; detail.hidden = !Number.isFinite(t.duration);
      info.append(name, detail); button.append(number, info);
      button.onclick = () => selecting ? toggleSelected(t.id) : startCollection(t.id);
      const more = document.createElement('button'); more.className = 'more'; more.innerHTML = icon('more'); more.setAttribute('aria-label', t.name + ' 메뉴'); more.onclick = () => openMenu(t.id);
      if (selecting) {
        const check = document.createElement('button'); check.className='selection-check';check.setAttribute('role','checkbox');check.setAttribute('aria-label',t.name+' 선택');check.setAttribute('aria-checked',String(selectedTracks.has(t.id)));check.textContent=selectedTracks.has(t.id)?'✓':'';check.disabled=bulkBusy;check.onclick=()=>toggleSelected(t.id);row.append(check);
        row.className += selectedTracks.has(t.id)?' selected':'';more.hidden=true;
      }
      row.append(button, more); $('trackList').append(row);
    });
    const t = track(currentId);
    $('trackTitle').textContent = t?.name || '음악을 추가해 주세요';
    $('trackSubtitle').textContent = t ? folderName(t.folderId) + ' · ' + (Math.max(0, queue.indexOf(currentId)) + 1) + ' / ' + queue.length + '곡' : '아이폰에 저장하고 계속 듣기';
    $('repeat').setAttribute('aria-pressed', String(repeatAll));
    updatePlayerUI();
  }
  function resetProgress() { $('seek').value = 0; $('elapsed').textContent = '0:00'; $('remaining').textContent = '−0:00'; $('seek').disabled = true; }
  function loadPrepared(id, reason, autoPlay) {
    if (!track(id) || !prepared.has(id)) return false;
    playGeneration++; currentId = id; restoreAt = 0;
    audio.loop = false; audio.src = prepared.get(id); audio.load();
    resetProgress(); render(); updateMedia(); record(reason); warmNext();
    if (autoPlay) play(); else say('곡을 선택했어요. 재생 버튼을 눌러 주세요.');
    return true;
  }
  async function choose(id, autoPlay = true, reason = '곡 선택') {
    // Cached tracks must start within the tap/ended handler without awaiting storage.
    if (prepared.has(id)) { loadPrepared(id, reason, autoPlay); return; }
    const generation = ++playGeneration;
    try {
      await prepare(id);
      if (generation !== playGeneration) return;
      loadPrepared(id, reason, autoPlay);
    } catch { if (generation === playGeneration) say('파일을 불러오지 못했어요. 곡을 다시 추가해 주세요.'); }
  }
  function play() {
    resumeBlocked=false;
    if (!currentId) {
      queue = visibleTracks().map(t => t.id);
      if (!queue.length) { say('먼저 음악을 추가해 주세요.'); return; }
      choose(queue[0]); return;
    }
    const generation = playGeneration;
    playAttemptGeneration=generation;
    audio.play().then(() => { if(playAttemptGeneration===generation)playAttemptGeneration=-1; }).catch(error => {
      if (generation !== playGeneration || error.name === 'AbortError') return;
      if (audio.error || error.name === 'NotSupportedError') recoverPlayback(true);
      else showDuplicate('재생 버튼을 다시 눌러 주세요.',[track(currentId)?.name || '']);
    });
  }
  function advance(reason = '다음 곡') {
    const id = nextId();
    if (!id) { say('모든 곡을 재생했어요.'); saveState(); return; }
    // Keep the same HTMLAudioElement and start a prepared URL immediately in ended.
    if (!loadPrepared(id, reason, true)) choose(id, true, reason);
  }
  function previous() {
    if (!currentId) { play(); return; }
    if (audio.currentTime > 3) { audio.currentTime = 0; play(); return; }
    const index = queue.indexOf(currentId);
    choose(queue[index > 0 ? index - 1 : repeatAll ? queue.length - 1 : 0], true, '이전 곡');
  }
  async function createFolder() {
    if (maintenance) return;
    const raw = prompt('새 폴더 이름'); if (raw === null) return;
    const name = raw.trim().slice(0, 40); if (!name) return;
    if (folders.some(f => f.name === name)) { say('같은 이름의 폴더가 있어요.'); return; }

    if(bulkBusy||maintenance||importing||converting)return;
    const destination=$('bulkMoveFolder').value;if(!physicalFolders().some(f=>f.id===destination))return;
    const items=pendingBulkIds.map(track).filter(Boolean);if(!items.length)return;
    bulkBusy=true;setMaintenance(true);$('confirmBulkMove').disabled=true;$('confirmBulkMove').textContent='이동 중…';$('cancelBulkMove').disabled=true;
    try {
      const changes=[],duplicateNames=[];let duplicates=0;
      say('선택한 곡의 중복을 확인하고 이동 중…');
      for(const t of items){
        if(await duplicateInFolder(t,destination)){duplicates++;duplicateNames.push(t.name);continue;}
        const blob=await read('files',t.id);if(!blob)throw Error('음악 파일 없음');
        const hash=t.contentHash||await fileHash(blob);
        if(changes.some(v=>v.size===t.size&&v.contentHash===hash)){duplicates++;duplicateNames.push(t.name);continue;}
        changes.push({...t,folderId:destination,contentHash:hash});
      }
      if(changes.length)await write(['tracks'],tx=>{for(const t of changes)tx.objectStore('tracks').put(t);});
      for(const t of changes)Object.assign(track(t.id),t);
      $('bulkMoveMenu').close();selectedTracks.clear();render();updateMedia();saveState();
      say(changes.length+'곡 이동 완료'+(duplicates?' · 이미 저장된 '+duplicates+'곡 제외':''));
      if(duplicates)showFolderDuplicate(destination,duplicateNames);
    }catch{say('이동을 저장하지 못했어요. 다시 시도해 주세요.');}
    finally {bulkBusy=false;setMaintenance(false);$('confirmBulkMove').disabled=false;$('confirmBulkMove').textContent='이동';$('cancelBulkMove').disabled=false;render();}
  };
  $('bulkDelete').onclick=()=>{
    if(maintenance||bulkBusy||!selectedTracks.size)return;
    pendingBulkIds=[...selectedTracks];pendingPlaylistId=collection()?.kind==='playlist'?activeFolder:null;
    $('bulkDeleteTitle').textContent=pendingBulkIds.length+'곡을 삭제할까요?';
    $('bulkDeleteNote').textContent=pendingPlaylistId?'목록에서만 제거하면 음악 파일은 남습니다. 음악함에서 삭제하면 모든 플레이리스트에서도 제거되며 되돌릴 수 없습니다.':'음악함과 모든 플레이리스트에서 삭제됩니다. 되돌릴 수 없습니다. 파일 앱의 원본은 유지됩니다.';
    $('removeSelectedPlaylist').hidden=!pendingPlaylistId;$('bulkDeleteMenu').showModal();
  };
  $('cancelBulkDelete').onclick=()=>{if(!bulkBusy)$('bulkDeleteMenu').close();};
  async function completeBulkDelete(files) {
    if(maintenance||bulkBusy||importing||converting)return;
    const ids=new Set(pendingBulkIds.filter(id=>track(id)));if(!ids.size)return;
    if(files){const recIds=[...ids].filter(id=>track(id)?.isRecording);if(recIds.length){await recorderUI.removeFromMusic(recIds);for(const id of recIds)ids.delete(id);if(!ids.size){$('bulkDeleteMenu').close();selectedTracks.clear();render();return;}}}
    const playlist=folders.find(f=>f.id===pendingPlaylistId&&f.kind==='playlist');if(!files&&!playlist)return;
    bulkBusy=true;setMaintenance(true);for(const id of ['deleteSelectedFiles','removeSelectedPlaylist','cancelBulkDelete'])$(id).disabled=true;
    try {
      const affected=files?folders.filter(f=>f.kind==='playlist'&&f.trackIds.some(id=>ids.has(id))):[playlist];
      const changes=affected.map(f=>({...f,trackIds:f.trackIds.filter(id=>!ids.has(id))}));
      await write(files?['tracks','files','folders']:['folders'],tx=>{for(const f of changes)tx.objectStore('folders').put(f);if(files)for(const id of ids){tx.objectStore('tracks').delete(id);tx.objectStore('files').delete(id);}});
      for(const f of changes)Object.assign(folders.find(v=>v.id===f.id),f);
      if(files){
        if(ids.has(currentId)){playGeneration++;audio.pause();audio.removeAttribute('src');audio.load();currentId=null;resetProgress();}
        tracks=tracks.filter(t=>!ids.has(t.id));queue=queue.filter(id=>!ids.has(id));
        for(const id of ids){if(prepared.has(id)){URL.revokeObjectURL(prepared.get(id));prepared.delete(id);}}
      }
      $('bulkDeleteMenu').close();selectedTracks.clear();render();warmNext();saveState();updateMedia();say(ids.size+(files?'곡을 음악함에서 삭제했어요.':'곡을 플레이리스트에서만 제거했어요.'));
    }catch{say('삭제하지 못했어요. 다시 시도해 주세요.');}
    finally{bulkBusy=false;setMaintenance(false);for(const id of ['deleteSelectedFiles','removeSelectedPlaylist','cancelBulkDelete'])$(id).disabled=false;render();}
  }
  $('deleteSelectedFiles').onclick=()=>completeBulkDelete(true);$('removeSelectedPlaylist').onclick=()=>completeBulkDelete(false);
  menuAction('bulkMove','folder','폴더로 이동');menuAction('bulkDelete','trash','삭제');

  // Shared dismissal gesture; controls and scrollable lists retain their own gestures.
  function enableSheetDrag(id) {
    const sheet = $(id);
    let gesture = null, settling = false, timer = null;
    const reset = () => {
      clearTimeout(timer); timer = null; gesture = null; settling = false;
      sheet.style.transform = ''; sheet.style.transition = ''; sheet.dataset.dragging = 'false';
    };
    sheet.addEventListener('close', reset);
    sheet.addEventListener('cancel',event=>{if(bulkBusy)event.preventDefault();});
    sheet.addEventListener('dragstart', event => event.preventDefault());
    sheet.addEventListener('pointerdown', event => {
      if (!sheet.open || settling || event.isPrimary === false || event.button !== 0) return;
      if (id === 'convertMenu' && converting || bulkBusy) return;
      const target = event.target;
      if (target.closest('button,input,select,label,a')) return;
      if (!target.closest('.sheet-grip,h3,.player-top,#nowPlaying .art')) return;
      gesture = {pointer:event.pointerId,x:event.clientX,y:event.clientY,at:event.timeStamp,distance:0,active:false};
      sheet.style.transition = 'none';
      sheet.setPointerCapture?.(event.pointerId);
    });
    sheet.addEventListener('pointermove', event => {
      if (!gesture || gesture.pointer !== event.pointerId) return;
      const dx = event.clientX - gesture.x, dy = event.clientY - gesture.y;
      if (!gesture.active && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) { reset(); return; }
      if (!gesture.active && dy < 8) return;
      gesture.active = true; gesture.distance = Math.max(0, dy);
      sheet.dataset.dragging = 'true';
      sheet.style.transform = 'translateY(' + gesture.distance + 'px)';
      event.preventDefault();
    });
    const finish = (event, cancelled = false) => {
      if (!gesture || gesture.pointer !== event.pointerId) return;
      const distance = gesture.distance, speed = distance / Math.max(1,event.timeStamp-gesture.at);
      const height = sheet.getBoundingClientRect().height;
      const dismiss = !cancelled && gesture.active && (distance > Math.min(150,height*.22) || distance > 45 && speed > .65);
      gesture = null;
      if (sheet.hasPointerCapture?.(event.pointerId)) sheet.releasePointerCapture(event.pointerId);
      sheet.dataset.dragging = 'false';
      sheet.style.transition = 'transform 220ms cubic-bezier(.2,.8,.2,1)';
      if (dismiss) {
        settling = true;
        sheet.style.transform = 'translateY(100vh)';
        timer = setTimeout(() => { sheet.close(); reset(); },220);
      } else {
        sheet.style.transform = 'translateY(0)';
        timer = setTimeout(reset,220);
      }
    };
    sheet.addEventListener('pointerup', event => finish(event));
    sheet.addEventListener('pointercancel', event => finish(event,true));
    sheet.addEventListener('lostpointercapture', event => finish(event,true));
  }
  for (const id of ['nowPlaying','addMenu','songMenu','playlistPicker','collectionMenu','songPicker','convertMenu','bulkMoveMenu','bulkDeleteMenu']) enableSheetDrag(id);

  function demoFile(number) {
    const rate = 22050, seconds = 12, samples = rate * seconds;
    const bytes = new ArrayBuffer(44 + samples * 2), view = new DataView(bytes);
    const text = (offset, value) => { for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i)); };
    text(0, 'RIFF'); view.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE'); text(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, rate, true); view.setUint32(28, rate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); text(36, 'data'); view.setUint32(40, samples * 2, true);
    const notes = number === 1 ? [261.63, 329.63, 392, 523.25] : [440, 392, 349.23, 329.63];
    for (let i = 0; i < samples; i++) { const t = i / rate, phase = t % .5; const envelope = Math.min(1, phase / .025) * Math.max(0, 1 - phase / .5) * Math.min(1, (seconds - t) / .1); view.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * notes[Math.floor(t * 2) % 4] * t) * envelope * 5000), true); }
    return new File([bytes], '테스트 음악 ' + number + '.wav', { type: 'audio/wav', lastModified: 0 });
  }
  $('demo').onclick = () => addFiles([demoFile(1), demoFile(2)]);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveState(); });
  window.addEventListener('pagehide', saveState);
  const keepInterruptedPlaybackPaused=()=>{if(!document.hidden&&resumeBlocked&&!audio.paused)audio.pause();};
  document.addEventListener('visibilitychange',keepInterruptedPlaybackPaused);
  window.addEventListener('pageshow',keepInterruptedPlaybackPaused);
  async function boot() {
    try {
      db = await openDB();
      folders = await read('folders');
      if (!folders.some(f => f.id === 'library')) { const f = { id: 'library', name: '음악함', createdAt: 0 }; await write(['folders'], tx => tx.objectStore('folders').put(f)); folders.unshift(f); }
      tracks = (await read('tracks')).sort((a, b) => a.addedAt - b.addedAt);
      let saved = {}; try { saved = JSON.parse(localStorage.getItem(STATE_KEY) || '{}'); } catch {}
      repeatAll = saved.repeatAll !== false;
      view = ['library','playlists','search','settings','recordings'].includes(saved.view) ? saved.view : 'library';
      sortBy = saved.sortBy === 'title' ? 'title' : 'added'; $('sort').value = sortBy;
      activeFolder = saved.activeFolder === 'all' || folders.some(f => f.id === saved.activeFolder) ? saved.activeFolder : 'all';
      const playable=id=>{const t=track(id);return t&&!t.recordingDeletedAt&&(!t.isRecording||t.inMusic);};
      queue = Array.isArray(saved.queue) ? saved.queue.filter(playable) : [];
      if (!queue.length) queue = visibleTracks().map(t => t.id);
      history = Array.isArray(saved.history) ? saved.history.slice(-20) : [];
      ready = true; $('openConvert').disabled = false; $('backup').disabled = false; $('restorePicker').disabled = false; render(); renderHistory(); $('filePicker').disabled = false; $('demo').disabled = false; $('addLabel').classList.remove('disabled');
      const id = playable(saved.currentId) ? saved.currentId : queue[0];
      if (id) { await choose(id, false, '저장된 곡 준비'); restoreAt = Number(saved.position) || 0; }
      say(tracks.length ? tracks.length + '곡을 불러왔어요. 곡을 눌러 재생하세요.' : '여러 MP3를 한 번에 추가하거나 테스트 음악 2곡을 담아 주세요.');
    } catch { say('음악 저장 공간을 열지 못했어요. 일반 Safari 창에서 다시 열어 주세요.'); }
  }
  if(window.initJoonRecorder)recorderUI=window.initJoonRecorder({
    root:$('recordingsPanel'), audio, icon, fmt, read:readAudioFile, notice:showDuplicate,
    getTracks:()=>tracks,getFolders:()=>folders,ready:()=>ready&&!maintenance&&!importing&&!converting,
    sheetDrag:enableSheetDrag,back:()=>setView('library'),isVisible:()=>view==='recordings',refresh:()=>{render();saveState();},
    async commit(changes, blobs=[], folderChanges=[], deletedIds=[]){
      await write(['tracks','files','folders'],tx=>{for(const t of changes)tx.objectStore('tracks').put(t);for(const [id,blob] of blobs)tx.objectStore('files').put(blob,id);for(const f of folderChanges)tx.objectStore('folders').put(f);for(const id of deletedIds){tx.objectStore('tracks').delete(id);tx.objectStore('files').delete(id);}});
      for(const t of changes){const old=track(t.id);if(old)Object.assign(old,t);else tracks.push(t);}for(const f of folderChanges){const old=folders.find(v=>v.id===f.id);if(old)Object.assign(old,f);else folders.push(f);}
      tracks=tracks.filter(t=>!deletedIds.includes(t.id));
      const unavailable=new Set([...deletedIds,...changes.filter(t=>t.recordingDeletedAt||t.isRecording&&!t.inMusic).map(t=>t.id)]);queue=queue.filter(id=>!unavailable.has(id));
      if(unavailable.has(currentId)){playGeneration++;audio.pause();audio.removeAttribute('src');audio.load();currentId=null;}
      for(const t of changes){if(prepared.has(t.id)){URL.revokeObjectURL(prepared.get(t.id));prepared.delete(t.id);}}for(const id of deletedIds){if(prepared.has(id)){URL.revokeObjectURL(prepared.get(id));prepared.delete(id);}}
      render();saveState();updateMedia();
    },hash:fileHash
  });
  boot();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(registration => registration.update()).catch(() => {});
  }
})();
